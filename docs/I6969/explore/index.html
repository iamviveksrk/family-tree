        n.appendChild(row);
      }
      n.appendChild(box(id, false, allowUp, allowDown));
      if (id === focus) {
        var sibs = siblingsOf(id);
        if (sibs.length) {
          var s = el('ex-sibs');
          s.appendChild(document.createTextNode('Siblings: '));
          sibs.forEach(function(sid, i) {
            if (i) s.appendChild(document.createTextNode(', '));
            var a = el('', 'a');
            a.href = '#';
            a.textContent = P[sid].n;
            a.title = 'Centre the tree on ' + P[sid].n;
            a.addEventListener('click', function(ev) { ev.preventDefault(); defaultState(sid); render(); });
            s.appendChild(a);
          });
          n.appendChild(s);
        }
      }
      if (allowDown && down.has(id) && hasChildren(id)) {
        var fams = el('ex-fams');
        p.f.forEach(function(f) {
          if (!f.c.length) return;
          var fam = el('ex-fam');
          var partner = el('ex-partner');
          if (f.p && P[f.p]) {
            partner.appendChild(document.createTextNode(f.m ? 'with ' : 'partner '));
            partner.appendChild(box(f.p, true));
          } else {
            partner.textContent = 'children';
          }
          fam.appendChild(partner);
          var kids = el('ex-kids');
          f.c.forEach(function(cid) { kids.appendChild(node(cid, false, true)); });
          fam.appendChild(kids);
          fams.appendChild(fam);
        });
        n.appendChild(fams);
      }
      return n;
    }

    function render() {
      var root = document.getElementById('explore');
      root.replaceChildren(node(focus, true, true));
      writeHash();
      var fb = root.querySelector('.ex-focus');
      if (fb) fb.scrollIntoView({ block: 'nearest', inline: 'center' });
    }

    // Search: names with years so duplicates can be told apart
    var byLabel = {};
    var list = document.getElementById('explore-names');
    Object.keys(P).sort(function(a, b) { return P[a].n.localeCompare(P[b].n); }).forEach(function(id) {
      var label = P[id].n + (years(P[id]) ? ' (' + years(P[id]) + ')' : '');
      if (byLabel[label]) label += ' [' + id + ']';
      byLabel[label] = id;
      var o = document.createElement('option');
      o.value = label;
      list.appendChild(o);
    });
    var search = document.getElementById('explore-search');
    // Picking a suggestion fires 'input' with the full label; typing a partial name does not match
    function jump() {
      var id = byLabel[search.value];
      if (id) { defaultState(id); render(); search.value = ''; search.blur(); }
    }
    search.addEventListener('input', jump);
    search.addEventListener('change', jump);
    document.getElementById('explore-reset').addEventListener('click', function() {
      defaultState(DATA.root); render();
    });
    window.addEventListener('hashchange', function() { readHash(); render(); });

    readHash();
    render();
    </script>
  
  <script>
  var viewAs = document.querySelector('.view-as');
  if (viewAs) {
    var currentId = viewAs.dataset.current;
    var path = window.location.pathname;
    var prefix = '/family-tree/' + currentId + '/';
    var pagePath = path.startsWith(prefix) ? path.slice(prefix.length) : '';
    viewAs.querySelectorAll('a[href]').forEach(function(a) {
      a.href = a.getAttribute('href') + pagePath;
    });
  }

  var tabs = document.querySelector('.person-tabs');
  if (tabs) {
    var activeTab = tabs.querySelector('span.active');
    if (activeTab) {
      var btn = document.createElement('button');
      btn.className = 'tabs-toggle';
      btn.textContent = '▾';
      btn.setAttribute('aria-label', 'Toggle tabs');
      activeTab.after(btn);
      btn.addEventListener('click', function() {
        var open = tabs.classList.toggle('open');
        btn.textContent = open ? '▴' : '▾';
      });
    }
  }

  var eventsTable = document.querySelector('.events table');
  if (eventsTable) {
    var headRow = eventsTable.querySelector('thead tr');
    var emptyTh = document.createElement('th');
    emptyTh.className = 'expand-td';
    headRow.appendChild(emptyTh);

    Array.from(eventsTable.querySelectorAll('tbody tr')).forEach(function(row) {
      var cell4 = row.cells[3];
      var cell5 = row.cells[4];

      var expandTd = document.createElement('td');
      expandTd.className = 'expand-td';
      row.appendChild(expandTd);

      var parts = [];
      if (cell4 && cell4.textContent.trim()) parts.push(cell4.innerHTML.trim());
      if (cell5 && cell5.textContent.trim()) parts.push(cell5.innerHTML.trim());
      if (!parts.length) return;

      var xbtn = document.createElement('button');
      xbtn.className = 'row-expand-btn';
      xbtn.textContent = '▾';
      expandTd.appendChild(xbtn);

      var detailRow = document.createElement('tr');
      detailRow.className = 'row-detail';
      var detailTd = document.createElement('td');
      detailTd.colSpan = row.cells.length;
      detailTd.innerHTML = parts.join(' &middot; ');
      detailRow.appendChild(detailTd);
      row.after(detailRow);

      xbtn.addEventListener('click', function() {
        var open = detailRow.classList.toggle('open');
        xbtn.textContent = open ? '▴' : '▾';
        detailRow.style.display = open ? '' : 'none';
      });
    });
  }
  </script>
</body>
</html>
